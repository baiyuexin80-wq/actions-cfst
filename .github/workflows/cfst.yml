name: Generate Cloudflare Best IPs

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC 时间；这里表示每 6 小时运行一次。
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: cfst-generate
  cancel-in-progress: true

env:
  CFST_VERSION: v2.3.5
  CFST_PORT: '443'
  CFST_TOP: '60'
  CFST_TL: '500'
  CFST_DN: '12'
  CFST_MIN_SPEED: '0.01'
  CFST_URL: 'https://speed.cloudflare.com/__down?bytes=50000000'
  CFST_TARGET_COLOS: 'HKG,NRT,TPE,SIN,KIX,ICN,LAX,SJC,SEA,DFW,ORD'

jobs:
  generate:
    name: Generate ADD.txt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CloudflareSpeedTest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools output
          url="https://github.com/XIU2/CloudflareSpeedTest/releases/download/${CFST_VERSION}/cfst_linux_amd64.tar.gz"
          curl -L --retry 3 --connect-timeout 20 -o /tmp/cfst.tar.gz "$url"
          tar -xzf /tmp/cfst.tar.gz -C tools
          chmod +x tools/cfst

      - name: Run CloudflareSpeedTest by colo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/raw
          IFS=',' read -ra COLOS <<< "${CFST_TARGET_COLOS}"
          for colo in "${COLOS[@]}"; do
            colo="$(echo "${colo}" | xargs)"
            echo "===== scan ${colo} ====="
            ./tools/cfst \
              -f "tools/ip.txt" \
              -tp "${CFST_PORT}" \
              -url "${CFST_URL}" \
              -httping \
              -cfcolo "${colo}" \
              -tl "${CFST_TL}" \
              -dn "${CFST_DN}" \
              -sl "${CFST_MIN_SPEED}" \
              -p "${CFST_DN}" \
              -o "output/raw/${colo}.csv" || true
          done
          ls -lah output/raw || true

      - name: Build ADD.txt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cfst_to_add.py \
            --input output/raw \
            --output output/ADD.txt \
            --merged-output output/result.csv \
            --port "${CFST_PORT}" \
            --top "${CFST_TOP}"
          echo '===== output/ADD.txt ====='
          cat output/ADD.txt

      - name: Commit output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/result.csv output/ADD.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'chore: update Cloudflare best IPs [skip ci]'
            git push
          fi


