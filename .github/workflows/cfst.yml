name: Collect Best IPs From Subscription Sources

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC 时间；这里表示每 6 小时运行一次。
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: cfst-generate
  cancel-in-progress: true

env:
  BEST_SUB_SOURCES: 'Cm.Soso.Edu.Kg,Sub.Cmliussss.Net,Owo.O00o.Ooo'
  BEST_SUB_TOP: '120'

jobs:
  generate:
    name: Generate ADD.txt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect IPs from subscription sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python3 scripts/cfst_to_add.py \
            --sources "${BEST_SUB_SOURCES}" \
            --output output/ADD.txt \
            --merged-output output/result.csv \
            --top "${BEST_SUB_TOP}"

      - name: Build ADD.txt
        shell: bash
        run: |
          set -euo pipefail
          wc -l output/ADD.txt || true
          echo '===== output/ADD.txt ====='
          cat output/ADD.txt

      - name: Commit output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/result.csv output/ADD.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'chore: update Cloudflare best IPs [skip ci]'
            git push
          fi


